# Talenti: base de datos, backend y frontend con un solo comando.
#   1. Copia .env.example como .env y completa los valores (el .env no se sube al repositorio).
#   2. docker compose up --build
# Este archivo no contiene contraseñas: todo viene de .env.

name: talenti

services:
  db:
    # Misma versión de pgvector que usan las pruebas (backend/src/test/.../TestcontainersConfiguration.java).
    image: pgvector/pgvector:0.8.2-pg18-trixie
    restart: unless-stopped
    environment:
      # Superusuario de la imagen: solo crea la base y ejecuta db/init/. El backend no lo usa.
      POSTGRES_DB: ${POSTGRES_DB:?copia .env.example como .env}
      POSTGRES_USER: ${POSTGRES_USER:?copia .env.example como .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?copia .env.example como .env}
      # Rol de la aplicación, sin superusuario; lo crea db/init/01-init-roles.sh.
      APP_DB_USER: ${APP_DB_USER:?copia .env.example como .env}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?copia .env.example como .env}
    volumes:
      # PostgreSQL 18 guarda sus datos bajo /var/lib/postgresql (ver notas de la imagen oficial).
      - pgdata:/var/lib/postgresql
      # Los scripts se ejecutan solo al crear el volumen vacío.
      - ./db/init:/docker-entrypoint-initdb.d:ro
    # Sin "ports": la base de datos solo es visible para los demás servicios de la red de Compose.
    # Sin cap_drop: PostgreSQL necesita capacidades al arrancar (cambio de usuario y de dueño).
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      code-runner:
        condition: service_started
      exam-sql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:?copia .env.example como .env}
      # Rol de la aplicación (sin superusuario), no el administrador de la imagen.
      SPRING_DATASOURCE_USERNAME: ${APP_DB_USER:?copia .env.example como .env}
      SPRING_DATASOURCE_PASSWORD: ${APP_DB_PASSWORD:?copia .env.example como .env}
      # Datos de ejemplo FICTICIOS (spec 004). El contenedor corre con el perfil prod, cuyo valor por defecto es
      # "false"; Compose lo enciende aquí (la demo). Para apagarlo: TALENTI_DEMO_DATA=false en el .env.
      TALENTI_DEMO_DATA: ${TALENTI_DEMO_DATA:-true}
      # Lector de CV (spec 009): la lectura mejorada con IA está APAGADA (talenti.ai.cv.enabled=false). Mientras
      # AI_PROVIDER sea "simulated" no se envía nada a ningún servicio externo. La clave solo viaja por esta variable.
      AI_PROVIDER: ${AI_PROVIDER:-simulated}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # Lectura mejorada con IA (apagada y sin modelo por defecto). Ver .env.example y el README.
      TALENTI_AI_CV_ENABLED: ${TALENTI_AI_CV_ENABLED:-false}
      TALENTI_AI_CV_MODEL: ${TALENTI_AI_CV_MODEL:-}
      # DORA por voz (spec 012): APAGADA por defecto (adaptadores simulados, nada sale hacia ningún servicio). Para la
      # prueba 012-34 con la clave de Favio: TALENTI_AI_DORA_ENABLED=true, los tres modelos y la voz. Ver .env.example.
      TALENTI_AI_DORA_ENABLED: ${TALENTI_AI_DORA_ENABLED:-false}
      TALENTI_AI_DORA_MODELS_DIALOG: ${TALENTI_AI_DORA_MODELS_DIALOG:-}
      TALENTI_AI_DORA_MODELS_STT: ${TALENTI_AI_DORA_MODELS_STT:-}
      TALENTI_AI_DORA_MODELS_TTS: ${TALENTI_AI_DORA_MODELS_TTS:-}
      TALENTI_AI_DORA_VOICE: ${TALENTI_AI_DORA_VOICE:-}
      # DORA en tiempo real (spec 012, enmienda 2): APAGADA por defecto. Para la prueba 012-69: TALENTI_AI_DORA_ENABLED=true,
      # TALENTI_AI_DORA_REALTIME_ENABLED=true y OPENAI_API_KEY. Modelo, voz y rutas están a confirmar. Ver .env.example.
      TALENTI_AI_DORA_REALTIME_ENABLED: ${TALENTI_AI_DORA_REALTIME_ENABLED:-false}
      # Solo recorridos locales sin IA: ofrece el tiempo real con el adaptador simulado (sin red ni voz).
      TALENTI_AI_DORA_REALTIME_SIMULATED: ${TALENTI_AI_DORA_REALTIME_SIMULATED:-false}
      TALENTI_AI_DORA_REALTIME_MODEL: ${TALENTI_AI_DORA_REALTIME_MODEL:-gpt-realtime-2.1}
      TALENTI_AI_DORA_REALTIME_VOICE: ${TALENTI_AI_DORA_REALTIME_VOICE:-marin}
      TALENTI_AI_DORA_REALTIME_TRANSCRIPTION_MODEL: ${TALENTI_AI_DORA_REALTIME_TRANSCRIPTION_MODEL:-gpt-4o-mini-transcribe}
      TALENTI_AI_DORA_REALTIME_PRICE_PER_MINUTE: ${TALENTI_AI_DORA_REALTIME_PRICE_PER_MINUTE:-0.30}
      # Tope del costo estimado del mes (dólares) y sesiones de práctica por persona y mes.
      TALENTI_AI_LIMITS_MONTHLY_SPEND: ${TALENTI_AI_LIMITS_MONTHLY_SPEND:-5}
      PRACTICE_SESSIONS_PER_MONTH: ${PRACTICE_SESSIONS_PER_MONTH:-20}
      # Topes de uso de IA entre todas las personas (lecturas por día y por mes).
      TALENTI_AI_LIMITS_GLOBAL_DAILY: ${TALENTI_AI_LIMITS_GLOBAL_DAILY:-100}
      TALENTI_AI_LIMITS_GLOBAL_MONTHLY: ${TALENTI_AI_LIMITS_GLOBAL_MONTHLY:-1500}
      # GitHub (spec 013): la conexión con inicio de sesión de GitHub está APAGADA por defecto. Las claves solo viajan
      # por estas variables (vacías en .env.example; las reales van solo en tu .env). Ver .env.example.
      TALENTI_GITHUB_OAUTH_ENABLED: ${TALENTI_GITHUB_OAUTH_ENABLED:-false}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      TALENTI_GITHUB_OAUTH_REDIRECT_URI: ${TALENTI_GITHUB_OAUTH_REDIRECT_URI:-http://localhost:3000/api/v1/github/oauth/callback}
      TALENTI_GITHUB_OAUTH_RETURN_URL: ${TALENTI_GITHUB_OAUTH_RETURN_URL:-http://localhost:3000/perfil}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      # Examen (014): la IA real sigue apagada; el código siempre corre en la caja aparte.
      TALENTI_AI_EXAM_ENABLED: ${TALENTI_AI_EXAM_ENABLED:-false}
      TALENTI_AI_EXAM_MODEL: ${TALENTI_AI_EXAM_MODEL:-}
      TALENTI_AI_EXAM_INPUT_PRICE: ${TALENTI_AI_EXAM_INPUT_PRICE:-0}
      TALENTI_AI_EXAM_OUTPUT_PRICE: ${TALENTI_AI_EXAM_OUTPUT_PRICE:-0}
      TALENTI_EXAM_SQL_OWNER_PASSWORD: ${EXAM_SQL_OWNER_PASSWORD:?define contraseña propia de exam-sql}
      TALENTI_EXAM_SQL_READER_PASSWORD: ${EXAM_SQL_READER_PASSWORD:?define contraseña propia de exam-sql}
    volumes:
      - exam-jobs:/var/lib/talenti/exam-jobs
    networks:
      - default
      - exam-net
    # Sin "ports": el navegador llega al backend solo a través del proxy de nginx (frontend).
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    # nginx sin privilegios escucha en el 8080 del contenedor.
    ports:
      - "${FRONTEND_PORT:?copia .env.example como .env}:8080"
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  code-runner:
    build: ./code-runner
    restart: unless-stopped
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp:rw,exec,nosuid,nodev,size=512m,mode=1777
    volumes:
      - exam-jobs:/jobs
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
      - KILL
    security_opt:
      - no-new-privileges:true
    mem_limit: 768m
    cpus: 2
    pids_limit: 160

  exam-sql:
    build: ./exam-sql
    restart: unless-stopped
    environment:
      POSTGRES_DB: exam
      POSTGRES_USER: exam_bootstrap
      POSTGRES_PASSWORD: ${EXAM_SQL_BOOTSTRAP_PASSWORD:?define contraseña propia de exam-sql}
      EXAM_SQL_OWNER_PASSWORD: ${EXAM_SQL_OWNER_PASSWORD:?define contraseña propia de exam-sql}
      EXAM_SQL_READER_PASSWORD: ${EXAM_SQL_READER_PASSWORD:?define contraseña propia de exam-sql}
    networks:
      - exam-net
    volumes:
      - exam-sql-data:/var/lib/postgresql
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 1
    pids_limit: 128
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U exam_bootstrap -d exam"]
      interval: 5s
      timeout: 5s
      retries: 15

volumes:
  pgdata:
  exam-jobs:
  exam-sql-data:

networks:
  exam-net:
    internal: true
