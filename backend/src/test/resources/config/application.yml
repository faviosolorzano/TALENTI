# Valores solo para las pruebas (se suman a src/main/resources/application.yml).
spring:
  datasource:
    hikari:
      # Cada contexto de Spring en caché mantiene su propio pool contra el mismo PostgreSQL de prueba (max_connections
      # = 100). Con el valor por defecto (10 abiertas por contexto) los contextos de las pruebas lo agotan.
      minimum-idle: 1
      maximum-pool-size: 6
talenti:
  identity:
    password:
      bcrypt-cost: 4           # el mínimo de BCrypt: pruebas rápidas
  cv:
    # Las pruebas llaman a la expiración a mano; la tarea programada no debe tocar filas de otras pruebas.
    expiry-interval: PT999H
    # Cada PDF se lee en un proceso Java hijo. En un equipo cargado (varias suites y Docker a la vez) solo arrancar ese
    # proceso puede pasar de los 5 s de producción, y la lectura se corta como "cv-unreadable" (pasaba también en main).
    # Aquí se da margen; producción sigue en 5 s. Las pruebas de PDF hostiles fijan su propio tiempo en el código.
    parse-timeout: 15s
  dora:
    # Las pruebas barren la inactividad a mano con reloj simulado (012-14).
    sweep-interval: PT999H
  ai:
    dora:
      realtime:
        # Las pruebas cierran por tiempo a mano con reloj simulado (012-49). Ninguna prueba sale a la red: el adaptador
        # en tiempo real es el SIMULADO salvo en la prueba de la clave, que usa un servidor local falso.
        sweep-interval: PT999H
  github:
    # NINGUNA prueba llama a GitHub real (spec 013, sección 9): por defecto ambas direcciones apuntan a un puerto local
    # cerrado, y las pruebas de GitHub las cambian por su servidor simulado. GithubNoRealNetworkTests lo vigila.
    base-url: http://127.0.0.1:9
    token: ""
    oauth:
      base-url: http://127.0.0.1:9
      client-id: ""
      client-secret: ""
  demo-data:
    # Las pruebas no dependen de la variable TALENTI_DEMO_DATA del equipo: parten sin datos de ejemplo y las
    # que los necesitan los piden con properties = "talenti.demo-data.enabled=true".
    enabled: false

---
# Las pruebas hablan HTTP sin TLS, así que las cookies no llevan Secure, salvo en el perfil prod,
# que las exige (las pruebas de ese perfil comprueban el atributo Secure).
spring:
  config:
    activate:
      on-profile: "!prod"
talenti:
  security:
    secure-cookies: false
