# Textos de los errores de la API (en español). El archivo se lee como UTF-8.
# Evita el apóstrofo: este formato lo trata como carácter especial cuando el texto lleva argumentos.
#
# problem.<codigo>.title / .detail    cuerpo Problem Details (RFC 9457); el código estable va en "code"
# validation.<campo>.<regla>          texto de una regla incumplida; si falta, se usa validation.<regla>

problem.unauthenticated.title=No autenticado
problem.unauthenticated.detail=Se requiere una sesión activa para acceder a este recurso.
problem.session-expired.title=Sesión expirada
problem.session-expired.detail=Tu sesión expiró por inactividad. Vuelve a ingresar.
problem.invalid-credentials.title=Credenciales no válidas
problem.invalid-credentials.detail=El correo o la contraseña no son correctos. Si fallaste varias veces, espera unos minutos antes de volver a intentarlo.
problem.csrf-invalid.title=Solicitud no permitida
problem.csrf-invalid.detail=Falta el token de seguridad de la solicitud o no es válido. Recarga la página e inténtalo de nuevo.
problem.access-denied.title=Acceso denegado
problem.access-denied.detail=No tienes permiso para realizar esta acción.
problem.validation-failed.title=Datos no válidos
problem.validation-failed.detail=Revisa los campos marcados e inténtalo de nuevo.
problem.email-already-registered.title=Correo ya registrado
problem.email-already-registered.detail=Ya existe una cuenta con ese correo. Puedes ingresar con ella.
problem.legal-version-outdated.title=Documentos legales desactualizados
problem.legal-version-outdated.detail=Los Términos y Condiciones y la Política de Privacidad cambiaron. Lee el texto actual y vuelve a aceptarlo.
problem.too-many-requests.title=Demasiadas solicitudes
problem.too-many-requests.detail=Hiciste demasiados intentos. Espera un momento antes de volver a intentarlo.
problem.malformed-request.title=Solicitud mal formada
problem.malformed-request.detail=No se pudo leer la solicitud. Revisa el formato e inténtalo de nuevo.
problem.not-found.title=No encontrado
problem.not-found.detail=El recurso solicitado no existe.
problem.method-not-allowed.title=Método no permitido
problem.method-not-allowed.detail=Este recurso no admite ese método.
problem.not-acceptable.title=Formato no disponible
problem.not-acceptable.detail=No hay una representación del recurso en el formato pedido.
problem.unsupported-media-type.title=Tipo de contenido no admitido
problem.unsupported-media-type.detail=El servidor solo acepta solicitudes en formato JSON.
problem.request-error.title=Solicitud no válida
problem.request-error.detail=No se pudo procesar la solicitud.
problem.vacancy-not-found.title=Vacante no encontrada
problem.vacancy-not-found.detail=Esta vacante no existe o ya no está disponible.
problem.search-timeout.title=Búsqueda demasiado lenta
problem.search-timeout.detail=La búsqueda tardó demasiado y se canceló. Prueba con menos palabras o inténtalo de nuevo en un momento.
problem.project-not-found.title=Proyecto no encontrado
problem.project-not-found.detail=Este proyecto no existe en tu perfil.
problem.payload-too-large.title=Solicitud demasiado grande
problem.payload-too-large.detail=Los datos enviados son demasiado grandes. Reduce el contenido e inténtalo de nuevo.
problem.cv-invalid-type.title=Tipo de archivo no admitido
problem.cv-invalid-type.detail=Solo se puede subir un archivo PDF.
problem.cv-too-large.title=Archivo demasiado grande
problem.cv-too-large.detail=El PDF pesa más de 2 MB. Sube una versión más liviana o completa tu perfil a mano.
problem.cv-unreadable.title=No pudimos leer el PDF
problem.cv-unreadable.detail=No encontramos texto que leer en este archivo. Puedes subir otro PDF o completar tu perfil a mano.
problem.analysis-in-progress.title=Ya tienes un CV en curso
problem.analysis-in-progress.detail=Ya tienes un análisis de CV abierto. Continúa con ese o descártalo antes de subir otro.
problem.analysis-not-ready.title=El análisis todavía no está listo
problem.analysis-not-ready.detail=Aún no hay sugerencias para revisar. Espera a que termine la lectura o vuelve a intentarla.
problem.analysis-not-found.title=Análisis no encontrado
problem.analysis-not-found.detail=Este análisis de CV no existe o ya se cerró.
problem.cv-limit-reached.title=Demasiados análisis de CV
problem.cv-limit-reached.detail=Llegaste al límite de análisis de CV por ahora. Inténtalo de nuevo más tarde o completa tu perfil a mano.
problem.ai-quota-reached.title=Cupo de lectura con IA agotado
problem.ai-quota-reached.detail=Ya usaste tus lecturas con IA de este mes. Se renuevan el primer día del mes; la lectura básica sigue disponible.
problem.internal-error.title=Error interno
problem.internal-error.detail=Ocurrió un error inesperado. Inténtalo de nuevo más tarde.

validation.required=Este campo es obligatorio.
validation.too-long=El valor es demasiado largo.
validation.invalid=El valor no es válido.
validation.email.invalid-format=Escribe un correo válido, por ejemplo nombre@ejemplo.com.
validation.email.too-long=El correo puede tener como máximo {0} caracteres.
validation.password.min-length=La contraseña debe tener al menos {0} caracteres.
validation.password.max-length=La contraseña puede tener como máximo {0} caracteres.
validation.password.max-bytes=La contraseña es demasiado larga: los acentos y los símbolos ocupan más espacio. Usa menos caracteres.
validation.password.needs-letter=La contraseña debe incluir al menos una letra.
validation.password.needs-digit=La contraseña debe incluir al menos un número.
validation.password.same-as-email=La contraseña no puede ser igual a tu correo.
validation.legalAccepted.must-be-accepted=Debes aceptar los Términos y Condiciones y la Política de Privacidad para continuar.
validation.legalVersion.required=Falta la versión de los documentos legales que aceptas.

# Vacantes (spec 004): parámetros del listado y de las destacadas. Nunca repiten el valor recibido.
validation.q.too-long=El texto de búsqueda puede tener como máximo {0} caracteres.
validation.q.too-many-terms=Escribe como máximo {0} palabras en la búsqueda (se ignoran las de una sola letra).
validation.modality.invalid=La modalidad no es válida. Usa REMOTE, HYBRID u ONSITE.
validation.modality.too-many=Puedes elegir como máximo {0} modalidades.
validation.location.invalid=La ubicación no es válida.
validation.location.too-many=Puedes elegir como máximo {0} ubicaciones.
validation.skill.invalid=La tecnología no es válida.
validation.skill.too-many=Puedes elegir como máximo {0} tecnologías.
validation.sort.invalid=El orden no es válido. Usa recent, company o relevance.
validation.page.invalid=La página debe ser un número entero.
validation.page.out-of-range=La página debe ser 1 o mayor.
validation.size.invalid=El tamaño de página debe ser un número entero.
validation.size.out-of-range=El tamaño de página debe estar entre {0} y {1}.
validation.limit.invalid=El límite debe ser un número entero.
validation.limit.out-of-range=El límite debe estar entre {0} y {1}.

# Perfil del estudiante (spec 006). Nunca repiten el valor recibido.
validation.min-length=Escribe al menos {0} caracteres.
validation.max-length=Escribe como máximo {0} caracteres.
validation.out-of-range=El valor debe estar entre {0} y {1}.
validation.max-items=Puedes elegir como máximo {0} elementos.
validation.duplicate=Este valor está repetido.
validation.unknown-skill=Esa habilidad no está en el catálogo.
validation.invalid-level=El nivel debe ser 1 (básico), 2 (intermedio) o 3 (avanzado).
validation.cycle.out-of-range=El ciclo debe estar entre {0} y {1}.
validation.hoursPerWeek.out-of-range=Las horas por semana deben estar entre {0} y {1}.
validation.projects.limit=Puedes tener como máximo {0} proyectos.
validation.technologies.required=Agrega al menos una tecnología.
validation.technologies.max-items=Puedes agregar como máximo {0} tecnologías.

# Compatibilidad (spec 007). Nunca repiten el valor recibido.
validation.vacancyId.required=Indica al menos una vacante.
validation.vacancyId.invalid=El identificador de una vacante no es válido.
validation.vacancyId.max-items=Puedes pedir como máximo {0} vacantes a la vez.

validation.file.required=Elige un archivo PDF.
validation.mode.invalid=El tipo de lectura no es válido.
validation.unknown-suggestion=Esta sugerencia no pertenece a tu análisis.
validation.invalid-action=Elige aceptar, editar o descartar.
validation.decisions.limit=Con esto pasarías el máximo de proyectos que puede tener tu perfil.
validation.decisions.required=Faltan las decisiones sobre las sugerencias.
validation.decisions.max-items=Enviaste demasiadas decisiones.
problem.cv-busy.title=Lector de CV ocupado
problem.cv-busy.detail=Hay muchos CV leyéndose en este momento. Espera unos segundos e inténtalo de nuevo.

problem.application-already-exists.title=Ya postulaste a esta vacante
problem.application-already-exists.detail=Ya tienes una postulación activa a esta vacante. Puedes verla en Mis postulaciones.
problem.vacancy-closed.title=Vacante cerrada
problem.vacancy-closed.detail=Esta vacante ya no está abierta, así que no se puede postular.
problem.application-not-found.title=Postulación no encontrada
problem.application-not-found.detail=Esta postulación no existe.
problem.application-not-withdrawable.title=No se puede retirar
problem.application-not-withdrawable.detail=Esta postulación ya no se puede retirar en su estado actual.
validation.vacancyId.required=Falta la vacante a la que quieres postular.
validation.vacancyId.invalid=La vacante no es válida.

# DORA (spec 012). Nunca repiten lo que la persona dijo ni escribió.
problem.session-not-found.title=Sesión no encontrada
problem.session-not-found.detail=Esta sesión con DORA no existe.
problem.session-open.title=Ya tienes una sesión abierta
problem.session-open.detail=Ya tienes una sesión con DORA en curso. Termínala antes de empezar otra.
problem.session-closed.title=La sesión ya terminó
problem.session-closed.detail=Esta sesión con DORA ya está cerrada.
problem.session-not-started.title=La sesión aún no empezó
problem.session-not-started.detail=Inicia la sesión con DORA antes de responder.
problem.turn-in-progress.title=Hay un turno en curso
problem.turn-in-progress.detail=DORA todavía está respondiendo tu turno anterior. Espera un momento.
problem.turn-id-conflict.title=Turno repetido
problem.turn-id-conflict.detail=Ese identificador de turno ya se usó en otra sesión. Vuelve a intentarlo.
problem.question-out-of-order.title=Pregunta no disponible
problem.question-out-of-order.detail=Esa no es la pregunta que toca responder ahora.
problem.retry-limit-reached.title=Ya repetiste esta respuesta
problem.retry-limit-reached.detail=Ya repetiste la respuesta a esta pregunta. Sigue con la siguiente.
problem.turn-not-found.title=Respuesta no encontrada
problem.turn-not-found.detail=Esta respuesta no existe en tu sesión.
problem.question-not-found.title=Pregunta no encontrada
problem.question-not-found.detail=Esta pregunta no existe o todavía no se hizo.
problem.feedback-not-retryable.title=No se puede reintentar
problem.feedback-not-retryable.detail=La retroalimentación de esta respuesta ya está lista o en camino.
problem.audio-unsupported.title=Audio no admitido
problem.audio-unsupported.detail=El audio debe ser WebM, Ogg, MP4, MP3 o WAV. También puedes responder por escrito.
problem.audio-too-large.title=Audio demasiado grande
problem.audio-too-large.detail=El audio pesa más de lo permitido. Responde más corto o por escrito.
problem.audio-too-long.title=Audio demasiado largo
problem.audio-too-long.detail=El audio dura más de 2 minutos. Responde más corto o por escrito.
problem.voice-unavailable.title=Voz no disponible
problem.voice-unavailable.detail=La voz de DORA no está disponible ahora. Puedes leer la pregunta en pantalla.
problem.practice-quota-reached.title=Cupo de prácticas con DORA agotado
problem.practice-quota-reached.detail=Ya usaste tus sesiones de práctica con DORA de este mes. Se renuevan el primer día del mes.
problem.interview-unavailable.title=Entrevista no disponible por ahora
problem.interview-unavailable.detail=La entrevista con DORA no está disponible en este momento. Tu postulación no cambió; inténtalo más tarde.
problem.interview-disabled.title=Entrevista no habilitada
problem.interview-disabled.detail=La entrevista con DORA no está habilitada por ahora.
problem.interview-not-allowed.title=No se puede iniciar la entrevista
problem.interview-not-allowed.detail=La entrevista solo se puede iniciar con la postulación enviada o con el examen terminado.
problem.interview-attempts-exhausted.title=Sin intentos disponibles
problem.interview-attempts-exhausted.detail=Ya no quedan intentos de entrevista para esta postulación.
problem.notice-version-outdated.title=El aviso cambió
problem.notice-version-outdated.detail=El aviso de la entrevista cambió. Léelo de nuevo y vuelve a aceptarlo.
validation.basis.no-confirmed-data=Tu perfil aún no tiene habilidades ni proyectos. Agrégalos o elige una vacante.
validation.topic.not-allowed=Elige un tema de la lista.
validation.noticeAccepted.must-be-accepted=Debes aceptar el aviso de la entrevista para continuar.
validation.questionCount.out-of-range=Elige entre {0} y {1} preguntas.
# GitHub (spec 013). Nunca repiten el valor recibido ni datos de GitHub.
problem.github-oauth-disabled.title=Conectar con GitHub no está disponible
problem.github-oauth-disabled.detail=La conexión con GitHub está apagada en este servidor.
problem.already-linked.title=Ya tienes GitHub conectado
problem.already-linked.detail=Primero desvincula tu cuenta de GitHub si quieres conectar otra.
problem.not-verified.title=GitHub no está conectado
problem.not-verified.detail=Conecta tu cuenta de GitHub para ver tus repositorios y sugerencias.
problem.github-rate-limited.title=GitHub limita las consultas
problem.github-rate-limited.detail=GitHub limita las consultas; vuelve a intentarlo a las {0}.
problem.github-unavailable.title=GitHub no responde
problem.github-unavailable.detail=GitHub no responde en este momento. Vuelve a intentarlo en unos minutos.
validation.repoIds.required=Indica la lista de repositorios elegidos (puede estar vacía).
validation.unknown-repository=Ese repositorio no está en tu lista de GitHub.
validation.items.required=Faltan las decisiones sobre las sugerencias.
validation.not-suggested=Esa habilidad no está entre tus sugerencias de GitHub.
