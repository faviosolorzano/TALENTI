# Configuración base de Talenti. Ningún secreto vive en este archivo.
#
# La conexión a PostgreSQL llega por variables de entorno. Spring Boot las enlaza solo
# (enlace relajado), por eso no se repiten aquí:
#   SPRING_DATASOURCE_URL       p. ej. jdbc:postgresql://db:5432/<base>
#   SPRING_DATASOURCE_USERNAME
#   SPRING_DATASOURCE_PASSWORD
# El perfil se elige con SPRING_PROFILES_ACTIVE (dev o prod).

spring:
  application:
    name: talenti-backend
  jpa:
    hibernate:
      ddl-auto: validate        # el esquema lo crea Flyway; Hibernate solo lo verifica
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC        # fechas siempre en UTC
  jackson:
    time-zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: true

management:
  endpoints:
    web:
      exposure:
        include: health         # solo /actuator/health
  endpoint:
    health:
      show-details: never
      show-components: never

server:
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
  servlet:
    session:
      # Sesión en memoria del servidor (basta para el E2). Expira tras 30 minutos sin actividad (001-14).
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
        # "Secure" sale de un solo interruptor, también para la cookie XSRF-TOKEN. Activo por defecto;
        # solo el perfil dev (HTTP local) y las pruebas lo apagan.
        secure: ${talenti.security.secure-cookies}

logging:
  pattern:
    correlation: "[%X{correlationId:-}] "
  level:
    # Postgres incluye el valor repetido (el correo) en el mensaje de una violación de unicidad
    # y Hibernate lo escribiría en el registro. El error se maneja y se responde 409 sin ese dato.
    org.hibernate.engine.jdbc.spi.SqlExceptionHelper: "OFF"

talenti:
  security:
    secure-cookies: true
  legal:
    # Los textos viven en src/main/resources/legal/<version>/ (una sola versión para todo el conjunto).
    version: v1
    published-at: 2026-10-11T00:00:00Z
  identity:
    password:
      min-length: 8             # decisión de Favio (spec 001, sección 10); se podrá subir
      max-length: 64
      bcrypt-cost: 12
    lockout:
      max-failed-attempts: 5
      duration: 15m
    login-rate-limit:
      # Por origen. El origen sale de la cabecera X-Real-IP que pone nginx (ver ClientOrigin).
      max-requests: 10
      window: 1m

---
spring:
  config:
    activate:
      on-profile: dev
logging:
  level:
    com.talenti: DEBUG
talenti:
  security:
    secure-cookies: false       # desarrollo por HTTP; el perfil prod siempre la exige

---
spring:
  config:
    activate:
      on-profile: prod
logging:
  level:
    root: WARN
    com.talenti: INFO
server:
  shutdown: graceful
talenti:
  security:
    secure-cookies: true
