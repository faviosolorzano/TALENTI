# Configuración base de Talenti. Ningún secreto vive en este archivo.
#
# La conexión a PostgreSQL llega por variables de entorno. Spring Boot las enlaza solo
# (enlace relajado), por eso no se repiten aquí:
#   SPRING_DATASOURCE_URL       p. ej. jdbc:postgresql://db:5432/<base>
#   SPRING_DATASOURCE_USERNAME
#   SPRING_DATASOURCE_PASSWORD
# El perfil se elige con SPRING_PROFILES_ACTIVE (dev o prod).

spring:
  application:
    name: talenti-backend
  jpa:
    hibernate:
      ddl-auto: validate        # el esquema lo crea Flyway; Hibernate solo lo verifica
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC        # fechas siempre en UTC
  jackson:
    time-zone: UTC
  servlet:
    multipart:
      # Lector de CV (spec 009): el tamaño real del PDF (2 MB) lo exige CvAnalysisService con talenti.cv.max-size y
      # responde 413 cv-too-large. Estos topes son una red de seguridad un poco mayor (el mismo 3 MB que nginx en
      # /api/v1/cv/). El umbral deja la subida en memoria: el PDF nunca se escribe en el disco.
      max-file-size: 3MB
      max-request-size: 4MB
      file-size-threshold: 4MB
  flyway:
    enabled: true
    # Flyway del ESQUEMA: estricto a propósito (sin ignore-migration-patterns ni out-of-order). Los datos de ejemplo
    # (classpath:db/demo) los carga un segundo Flyway con su propio historial, solo si
    # talenti.demo-data.enabled=true (ver DemoDataConfiguration); no pasan por este.
    locations: classpath:db/migration
    clean-disabled: true

management:
  endpoints:
    web:
      exposure:
        include: health         # solo /actuator/health
  endpoint:
    health:
      show-details: never
      show-components: never

server:
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
  servlet:
    session:
      tracking-modes: cookie    # el identificador de sesión nunca viaja en la URL
      # Sesión en memoria del servidor (basta para el E2). Expira tras 30 minutos sin actividad (001-14).
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
        # "Secure" sale de un solo interruptor, también para la cookie XSRF-TOKEN. Activo por defecto;
        # solo el perfil dev (HTTP local) y las pruebas lo apagan.
        secure: ${talenti.security.secure-cookies}

logging:
  pattern:
    correlation: "[%X{correlationId:-}] "
  level:
    # Motivo: Postgres incluye el valor repetido (el correo) en el mensaje de una violación de unicidad
    # ("Key (email)=(...) already exists") y Hibernate lo escribiría en el registro, contra RNF-19.
    # Ese error se maneja y se responde 409 sin ese dato.
    # Qué se pierde: este logger también es el que imprime, al nivel WARN/ERROR, el SQLState y el mensaje de
    # CUALQUIER otro error SQL (por ejemplo una columna inexistente). Esos errores siguen llegando como excepción
    # y quedan en el registro con su clase (GlobalExceptionHandler), pero sin el texto del motor. Para diagnosticar
    # en desarrollo, súbelo con LOGGING_LEVEL_ORG_HIBERNATE_ENGINE_JDBC_SPI_SQLEXCEPTIONHELPER=WARN, solo ahí.
    org.hibernate.engine.jdbc.spi.SqlExceptionHelper: "OFF"

talenti:
  security:
    secure-cookies: true
  vacancy:
    # Tiempo máximo de cada consulta de la búsqueda de vacantes (spec 004). Al agotarse, la petición responde 503
    # search-timeout en vez de ocupar la base de datos. Formato de duración de Spring (por ejemplo 5s).
    search-timeout: 5s
  profile:
    # Perfil del estudiante (spec 006, RN-14): todo parámetro de la regla vive aquí, no en el código.
    max-projects: 10            # proyectos por perfil (006-08)
    max-cycle: 10               # ciclo de 1 a este valor (006-05)
    completeness:
      # Avance del perfil (RN-11, 006-09): todo o nada por ítem. Los pesos deben sumar 100 (si no, el arranque falla).
      weights:
        academic: 15            # carrera, instituto y ciclo
        skills: 25              # al menos min-skills habilidades
        availability: 15        # horas por semana y al menos min-modalities modalidades
        projects: 25            # al menos 1 proyecto
        location: 10            # ubicación
        about: 10               # presentación "Sobre ti" (el nombre no cuenta)
      min-skills: 3
      min-modalities: 1
  matching:
    # Fórmula de compatibilidad (spec 007, RN-01 y RN-14): todo parámetro vive aquí, no en el código. Si cambia un
    # peso o un umbral, sube CompatibilityCalculator.FORMULA_VERSION. Los cuatro pesos deben sumar 100 (si no, el
    # arranque falla).
    weights:
      required: 50              # A. requisitos obligatorios
      desirable: 15             # B. requisitos deseables
      conditions: 20            # C. modalidad, ubicación y disponibilidad
      similarity: 15            # D. similitud de proyectos (apagada hasta S12)
    cap: 69                     # máximo si falta un requisito obligatorio (crédito 0)
    partial-credit: 0.5         # crédito de un requisito que se tiene en un nivel menor
    cosine:
      low: 0.20                 # coseno que vale 0
      high: 0.60                # coseno que vale 1
    min-evaluable-weight: 50    # menos peso evaluable que esto = información insuficiente (RN-02)
    verdict:
      high: 80                  # desde aquí "Encajas muy bien"
      medium: 60                # desde aquí "Encajas con algo de refuerzo"
    similarity:
      enabled: false            # sin embeddings hasta S12: el componente D no se evalúa y los pesos se reajustan

  cv:
    # Lector de CV (spec 009, sección 5).
    max-size: 2MB               # tamaño máximo del PDF
    max-pages: 10
    min-text-chars: 200         # menos que esto = sin texto legible (no hay OCR)
    max-text-chars: 100000
    parse-timeout: 5s
    analysis-timeout: 15s       # lectura básica
    retention: 7d               # un análisis vence a los 7 días
    daily-limit: 5              # análisis nuevos por persona en 24 horas
    origin-limit-per-minute: 10
    careers-resource: classpath:cv/careers.txt
    max-concurrent-extractions: 2   # PDF leyéndose a la vez en todo el servidor (cada uno en un proceso hijo)
    failed-attempts-per-day: 20     # subidas fallidas (PDF ilegible) por persona en 24 horas
    expiry-interval: PT1H       # cada cuánto se borra lo vencido
  ai:
    # Control de consumo de IA (spec 009, sección 3.1). La IA real está APAGADA hasta S10: sin cv.enabled=true, un
    # modelo (D-12) y OPENAI_API_KEY no se envía nada a ningún servicio externo, y la lectura básica sigue igual.
    provider: ${AI_PROVIDER:simulated}      # simulated | openai
    reuse-window: 30d           # misma huella ya leída con IA: no se vuelve a enviar (009-26)
    cv:
      enabled: false
      model: ""                 # el modelo más económico que cumpla, elegido con la prueba de 10 casos (D-12)
      max-input-chars: 12000    # lo máximo que sale hacia la IA (009-30)
      max-output-tokens: 3000
      timeout: 30s
    openai:
      api-key: ${OPENAI_API_KEY:}           # solo por variable de entorno; nunca en el código
      base-url: https://api.openai.com/v1
    dora:
      # DORA por voz (spec 012, 012-31). APAGADA: con false se usan adaptadores simulados y no sale nada hacia
      # ningún servicio externo. Con true hacen falta OPENAI_API_KEY, los tres modelos y la voz (si no, no arranca).
      enabled: ${TALENTI_AI_DORA_ENABLED:false}
      models:
        dialog: ${TALENTI_AI_DORA_MODELS_DIALOG:}   # conversación (plan, frase puente, retroalimentación); a confirmar
        stt: ${TALENTI_AI_DORA_MODELS_STT:}         # voz a texto; a confirmar
        tts: ${TALENTI_AI_DORA_MODELS_TTS:}         # texto a voz; a confirmar
      voice: ${TALENTI_AI_DORA_VOICE:}              # voz femenina de DORA (D-14); a confirmar
      prices:
        # Precios en dólares para ESTIMAR el costo (012-30). A CONFIRMAR con la página de precios del proveedor antes
        # de la prueba 012-34; no son una factura. Tokens estimados como caracteres / 4.
        dialog-input-per-million-tokens: ${TALENTI_AI_DORA_PRICE_DIALOG_INPUT:0.15}
        dialog-output-per-million-tokens: ${TALENTI_AI_DORA_PRICE_DIALOG_OUTPUT:0.60}
        stt-per-minute: ${TALENTI_AI_DORA_PRICE_STT_MINUTE:0.003}
        tts-per-million-chars: ${TALENTI_AI_DORA_PRICE_TTS_MILLION_CHARS:15}
    limits:
      per-user-monthly:
        cv-read: 3              # lecturas mejoradas por persona y mes calendario (009-28)
        practice-session: ${PRACTICE_SESSIONS_PER_MONTH:20}   # sesiones de práctica con DORA por persona y mes (RN-13, duda 2)
      global-daily: 100         # usos completados por día entre todos, por función (009-29)
      global-monthly: 1500
      zone: America/Lima        # define el día y el mes calendario
      # Tope del costo ESTIMADO del mes entre todos, en dólares (012-30). Al llegar, DORA se degrada: banco base,
      # plantillas, solo texto y retroalimentación no disponible. Provisional: lo fija Favio al cargar la clave.
      monthly-spend: ${TALENTI_AI_LIMITS_MONTHLY_SPEND:5}
  dora:
    # DORA (spec 012, sección 5). La fluidez manda: cada paso tiene su tiempo máximo y, al agotarse, se degrada.
    question-timeout: 8s        # planificar las preguntas con la IA; después, banco base (012-04)
    bridge-timeout: 1500ms      # primer fragmento de la frase puente; después, plantilla (012-09)
    bridge-max: 6s              # frase puente completa
    bridge-max-tokens: 80
    stt-timeout: 6s             # voz a texto, con un reintento si queda tiempo (012-11)
    tts-timeout: 4s             # cada síntesis de voz (012-11)
    feedback-timeout: 15s       # retroalimentación (012-19)
    max-audio-bytes: 3MB        # audio de un turno (012-07); nginx admite 4 MB en /api/v1/dora/
    max-audio: 120s
    max-transcript: 4000
    inactivity-timeout: 15m     # sin actividad, la sesión se cierra (012-14)
    sweep-interval: PT1M
    retry-per-question: 1       # repetir la última respuesta en la práctica (duda 11)
    turns-per-minute: 30        # por persona (012-32)
    max-questions: 5            # RN-09
    rubric-weights:             # total de la retroalimentación (deben sumar 100)
      "[TECHNICAL_ACCURACY]": 25
      "[CLARITY]": 25
      "[STRUCTURE]": 25
      "[EXAMPLES]": 25
    interview:
      enabled: true             # entrevista evaluada para postulaciones enviadas (duda 9)
      max-attempts: 2           # intentos tras desconexión o falla (duda 10)
      question-count: 5
      notice-version: v1        # classpath:practice/interview-notice-v1.md (borrador, revisión legal pendiente)
  demo-data:
    # DATOS DE EJEMPLO FICTICIOS (spec 004): 8 empresas y 12 vacantes de programación, sin marcas reales ni logos.
    # Encendida = un segundo Flyway (historial flyway_schema_history_demo) carga también classpath:db/demo.
    # Se controla con la variable TALENTI_DEMO_DATA:
    #   - sin definirla: apagada (este valor por defecto) y también en el perfil prod;
    #   - perfil dev: encendida por defecto (ver abajo);
    #   - Docker Compose: la enciende con TALENTI_DEMO_DATA=true (el contenedor corre con el perfil prod).
    # Apagarla después de encenderla no borra lo cargado: para empezar de cero, "docker compose down -v".
    enabled: ${TALENTI_DEMO_DATA:false}
  legal:
    # Los textos viven en src/main/resources/legal/<version>/ (una sola versión para todo el conjunto).
    version: v1
    published-at: 2026-10-11T00:00:00Z
  identity:
    password:
      min-length: 8             # decisión de Favio (spec 001, sección 10); se podrá subir
      max-length: 64
      bcrypt-cost: 12
    lockout:
      max-failed-attempts: 5
      duration: 15m
    login-rate-limit:
      # Por origen. El origen sale de la cabecera X-Real-IP que pone nginx (ver ClientOrigin).
      max-requests: 10
      window: 1m
    register-rate-limit:
      # Cubo propio, por origen. 10 es deliberado: varias personas de un mismo laboratorio comparten IP.
      max-requests: 10
      window: 1m

---
spring:
  config:
    activate:
      on-profile: dev
logging:
  level:
    com.talenti: DEBUG
talenti:
  security:
    secure-cookies: false       # desarrollo por HTTP; el perfil prod siempre la exige
  demo-data:
    enabled: ${TALENTI_DEMO_DATA:true}      # en desarrollo hay vacantes de ejemplo salvo que se apague

---
spring:
  config:
    activate:
      on-profile: prod
logging:
  level:
    root: WARN
    com.talenti: INFO
server:
  shutdown: graceful
talenti:
  security:
    secure-cookies: true
  demo-data:
    enabled: ${TALENTI_DEMO_DATA:false}     # producción: apagada salvo que se encienda a propósito con la variable
