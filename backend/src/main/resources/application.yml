# Configuración base de Talenti. Ningún secreto vive en este archivo.
#
# La conexión a PostgreSQL llega por variables de entorno. Spring Boot las enlaza solo
# (enlace relajado), por eso no se repiten aquí:
#   SPRING_DATASOURCE_URL       p. ej. jdbc:postgresql://db:5432/<base>
#   SPRING_DATASOURCE_USERNAME
#   SPRING_DATASOURCE_PASSWORD
# El perfil se elige con SPRING_PROFILES_ACTIVE (dev o prod).

spring:
  application:
    name: talenti-backend
  jpa:
    hibernate:
      ddl-auto: validate        # el esquema lo crea Flyway; Hibernate solo lo verifica
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC        # fechas siempre en UTC
  jackson:
    time-zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: true

management:
  endpoints:
    web:
      exposure:
        include: health         # solo /actuator/health
  endpoint:
    health:
      show-details: never
      show-components: never

server:
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

---
spring:
  config:
    activate:
      on-profile: dev
logging:
  level:
    com.talenti: DEBUG

---
spring:
  config:
    activate:
      on-profile: prod
logging:
  level:
    root: WARN
    com.talenti: INFO
server:
  shutdown: graceful
