# Configuración base de Talenti. Ningún secreto vive en este archivo.
#
# La conexión a PostgreSQL llega por variables de entorno. Spring Boot las enlaza solo
# (enlace relajado), por eso no se repiten aquí:
#   SPRING_DATASOURCE_URL       p. ej. jdbc:postgresql://db:5432/<base>
#   SPRING_DATASOURCE_USERNAME
#   SPRING_DATASOURCE_PASSWORD
# El perfil se elige con SPRING_PROFILES_ACTIVE (dev o prod).

spring:
  application:
    name: talenti-backend
  jpa:
    hibernate:
      ddl-auto: validate        # el esquema lo crea Flyway; Hibernate solo lo verifica
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC        # fechas siempre en UTC
  jackson:
    time-zone: UTC
  flyway:
    enabled: true
    # Solo el esquema. Los datos de ejemplo (classpath:db/demo, V1000 en adelante) los agrega
    # DemoDataConfiguration cuando talenti.demo-data.enabled=true.
    locations: classpath:db/migration
    clean-disabled: true
    # Si la demo se enciende y luego se apaga, Flyway ve migraciones aplicadas que ya no encuentra (V1000+): se
    # ignoran en vez de fallar. "out-of-order" permite que una migración de esquema nueva (por ejemplo V4) se aplique
    # en una base donde la demo ya cargó V1000; sin él, Flyway la rechazaría por tener una versión menor.
    ignore-migration-patterns: "*:missing,*:future"
    out-of-order: true

management:
  endpoints:
    web:
      exposure:
        include: health         # solo /actuator/health
  endpoint:
    health:
      show-details: never
      show-components: never

server:
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
  servlet:
    session:
      tracking-modes: cookie    # el identificador de sesión nunca viaja en la URL
      # Sesión en memoria del servidor (basta para el E2). Expira tras 30 minutos sin actividad (001-14).
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
        # "Secure" sale de un solo interruptor, también para la cookie XSRF-TOKEN. Activo por defecto;
        # solo el perfil dev (HTTP local) y las pruebas lo apagan.
        secure: ${talenti.security.secure-cookies}

logging:
  pattern:
    correlation: "[%X{correlationId:-}] "
  level:
    # Motivo: Postgres incluye el valor repetido (el correo) en el mensaje de una violación de unicidad
    # ("Key (email)=(...) already exists") y Hibernate lo escribiría en el registro, contra RNF-19.
    # Ese error se maneja y se responde 409 sin ese dato.
    # Qué se pierde: este logger también es el que imprime, al nivel WARN/ERROR, el SQLState y el mensaje de
    # CUALQUIER otro error SQL (por ejemplo una columna inexistente). Esos errores siguen llegando como excepción
    # y quedan en el registro con su clase (GlobalExceptionHandler), pero sin el texto del motor. Para diagnosticar
    # en desarrollo, súbelo con LOGGING_LEVEL_ORG_HIBERNATE_ENGINE_JDBC_SPI_SQLEXCEPTIONHELPER=WARN, solo ahí.
    org.hibernate.engine.jdbc.spi.SqlExceptionHelper: "OFF"

talenti:
  security:
    secure-cookies: true
  demo-data:
    # DATOS DE EJEMPLO FICTICIOS (spec 004): 8 empresas y 12 vacantes de programación, sin marcas reales ni logos.
    # Encendida = Flyway carga también classpath:db/demo. Se controla con la variable TALENTI_DEMO_DATA:
    #   - sin definirla: apagada (este valor por defecto) y también en el perfil prod;
    #   - perfil dev: encendida por defecto (ver abajo);
    #   - Docker Compose: la enciende con TALENTI_DEMO_DATA=true (el contenedor corre con el perfil prod).
    # Apagarla después de encenderla no borra lo cargado: para empezar de cero, "docker compose down -v".
    enabled: ${TALENTI_DEMO_DATA:false}
  legal:
    # Los textos viven en src/main/resources/legal/<version>/ (una sola versión para todo el conjunto).
    version: v1
    published-at: 2026-10-11T00:00:00Z
  identity:
    password:
      min-length: 8             # decisión de Favio (spec 001, sección 10); se podrá subir
      max-length: 64
      bcrypt-cost: 12
    lockout:
      max-failed-attempts: 5
      duration: 15m
    login-rate-limit:
      # Por origen. El origen sale de la cabecera X-Real-IP que pone nginx (ver ClientOrigin).
      max-requests: 10
      window: 1m
    register-rate-limit:
      # Cubo propio, por origen. 10 es deliberado: varias personas de un mismo laboratorio comparten IP.
      max-requests: 10
      window: 1m

---
spring:
  config:
    activate:
      on-profile: dev
logging:
  level:
    com.talenti: DEBUG
talenti:
  security:
    secure-cookies: false       # desarrollo por HTTP; el perfil prod siempre la exige
  demo-data:
    enabled: ${TALENTI_DEMO_DATA:true}      # en desarrollo hay vacantes de ejemplo salvo que se apague

---
spring:
  config:
    activate:
      on-profile: prod
logging:
  level:
    root: WARN
    com.talenti: INFO
server:
  shutdown: graceful
talenti:
  security:
    secure-cookies: true
  demo-data:
    enabled: ${TALENTI_DEMO_DATA:false}     # producción: apagada salvo que se encienda a propósito con la variable
