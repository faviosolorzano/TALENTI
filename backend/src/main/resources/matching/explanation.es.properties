# Plantillas de la explicación de la compatibilidad (spec 007-13). Se leen como UTF-8.
# La explicación se arma SOLO con el resultado estructurado: no usa IA y no incluye datos personales.
# Subir "version" cada vez que cambie la redacción. Los huecos van entre llaves, por ejemplo {met}.
version=1

level.1=básico
level.2=intermedio
level.3=avanzado

insufficient.NO_SKILLS=Agrega al menos una habilidad a tu perfil para poder calcular tu compatibilidad con esta vacante.
insufficient.LOW_INFORMATION=Todavía no hay información suficiente en tu perfil para calcular un porcentaje confiable con esta vacante.
insufficient.VACANCY_WITHOUT_REQUIREMENTS=Esta vacante aún no tiene requisitos registrados, así que no se puede calcular la compatibilidad.

required.summary=Cumples {met} de {total} requisitos obligatorios.
required.summary.one=Cumples {met} de {total} requisito obligatorio.
required.none=Esta vacante no pide requisitos obligatorios.

gap.required.missing=La brecha principal es {skill}: es un requisito obligatorio que aún no figura en tu perfil.
gap.required.partial=La brecha principal es {skill}: se pide nivel {required} y tu perfil indica nivel {profile}.
gap.desirable.missing=Entre los requisitos deseables, aún no figura {skill} en tu perfil.
gap.desirable.partial=Entre los requisitos deseables, {skill} se pide en nivel {required} y tu perfil indica nivel {profile}.

cap.warning=Como falta un requisito obligatorio, el máximo posible para esta vacante es {cap} %.

basis=Este resultado se basa en el {basis} % de la información disponible.

missing.intro=Para evaluar mejor, completa en tu perfil:
missing.MODALITY=las modalidades que aceptas
missing.LOCATION=tu ubicación
missing.AVAILABILITY=tus horas por semana
