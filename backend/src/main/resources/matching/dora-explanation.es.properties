# Plantilla de "DORA te explica" (spec 015-10, RF-25). Se lee como UTF-8. Se usa cuando la IA está apagada, tarda más
# de lo permitido, falla, se alcanzó un límite o su salida no pasó la validación. Se arma SOLO con el resultado
# estructurado: no usa IA, no incluye datos personales ni porcentajes y tutea. Mismos datos, mismo texto.
# Subir "version" cada vez que cambie la redacción. Los huecos van entre llaves, por ejemplo {skill}.
# OJO: no uses palabras que sean sinónimos de habilidades del catálogo ("pruebas", "contenedores", "APIs"...): la
# plantilla debe pasar la misma validación que la salida de la IA (lo vigila una prueba).
version=1

and=y
and.more=y {count} más

kind.REQUIRED=obligatorio
kind.DESIRABLE=deseable

fit.skills=Cumples lo que pide la vacante en {skills}.
fit.none=Aún no coincides con las habilidades que pide esta vacante; abajo ves por dónde empezar.
fit.conditions=También encajan {conditions}.

condition.match.MODALITY=la modalidad
condition.match.LOCATION=la ubicación
condition.match.AVAILABILITY=tus horas disponibles

gaps.intro=Lo que te falta:
gap.missing={skill} ({kind}) aún no figura en tu perfil.
gap.partial={skill} ({kind}) se pide en nivel {required} y tu perfil indica nivel {profile}.
condition.gap.MODALITY=La modalidad de la vacante no está entre las que aceptas.
condition.gap.LOCATION=La ubicación de la vacante no coincide con la tuya.
condition.gap.AVAILABILITY=La vacante pide más horas por semana de las que tienes disponibles.

unknown=Aún no sabemos {items}; complétalo en tu perfil para que el cálculo use esa información. No es algo en tu contra.
missing.MODALITY=qué modalidades aceptas
missing.LOCATION=tu ubicación
missing.AVAILABILITY=cuántas horas por semana tienes
missing.SKILLS=qué habilidades tienes

practice.review=Repasa {skill} hasta nivel {required}.
practice.exercise=Haz un ejercicio pequeño con {skill}.
