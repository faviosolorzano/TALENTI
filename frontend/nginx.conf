# Talenti frontend: static files, SPA fallback, proxy of /api/ to the backend.
# This file replaces conf.d/default.conf (http context) of the nginx image.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # ---- Compression ----
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_comp_level 5;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml;

    # ---- Basic security headers ----
    # NOTE: add_header in a location block replaces these, so keep them at server level.
    # If a future screen needs more (inline styles, external fonts, audio from blob:),
    # relax the Content-Security-Policy here on purpose, not by removing it.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=(self)" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; connect-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    # Strict-Transport-Security is NOT set here: it belongs to the HTTPS terminator (demo plan).

    # ---- Health check for the container ----
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # ---- API: proxy to the backend, keeping the /api/ prefix ----
    # Docker's internal DNS is used, and the name is resolved on each request (variable),
    # so nginx starts even if the backend is not up yet.
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend_upstream http://backend:8080;

        # No URI part in proxy_pass: the original URI (with /api/) goes to the backend as is.
        proxy_pass $backend_upstream;

        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        client_max_body_size 10m;
        proxy_read_timeout 60s;
    }

    # ---- Files with a hash in the name never change: cache them for a long time ----
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    location /brand/ {
        expires 1d;
        try_files $uri =404;
    }

    # ---- SPA: any other route returns index.html (the router decides in the browser) ----
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
