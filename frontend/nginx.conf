# Frontend de Talenti: archivos estáticos, fallback de la SPA y proxy de /api/ hacia el backend.
# Este archivo reemplaza conf.d/default.conf (contexto http) de la imagen de nginx.
# El pid y las cachés temporales ya apuntan a /tmp en nginx.conf de la imagen unprivileged.

# Registro de accesos SIN la cadena de consulta: el texto que la persona busca
# (por ejemplo ?q=...) no debe quedar guardado en ningún registro (spec 004).
log_format sin_consulta '$remote_addr - [$time_local] "$request_method $uri $server_protocol" '
                        '$status $body_bytes_sent "$http_user_agent"';

server {
    access_log /dev/stdout sin_consulta;

    # Puerto sin privilegios: no hace falta ser root ni tener capacidades extra.
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # ---- Compresión ----
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_comp_level 5;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml;

    # ---- Cabeceras de seguridad básicas ----
    # OJO: un add_header dentro de un location reemplaza a estos, así que se dejan a nivel de server.
    # Si una pantalla futura necesita más (estilos en línea, fuentes externas, audio desde blob:),
    # se relaja la Content-Security-Policy aquí a propósito, no quitándola.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=(self)" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; connect-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    # Strict-Transport-Security NO se pone aquí: le corresponde a quien termine el HTTPS (plan de la demo).

    # ---- Verificación de salud del contenedor ----
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # ---- API: proxy hacia el backend, conservando el prefijo /api/ ----
    # Se usa el DNS interno de Docker y el nombre se resuelve en cada petición (variable),
    # así nginx arranca aunque el backend todavía no esté levantado.
    location /api/ {
        # El registro de errores de nginx copia la URL completa cuando falla el proxy
        # (con ?q=... incluido). Para que el texto que alguien busca no quede guardado,
        # aquí solo se registran errores críticos. Costo: se pierde el detalle de fallos
        # del proxy; el estado del backend se ve en su healthcheck.
        error_log /dev/stderr crit;
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend_upstream http://backend:8080;

        # proxy_pass sin parte de URI: la URI original (con /api/) llega tal cual al backend.
        proxy_pass $backend_upstream;

        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        # Se reemplaza (no se acumula) la cabecera que pueda traer el cliente: evita falsificarla.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Spring ya envía estas cabeceras; se ocultan para que no lleguen duplicadas
        # (las de nivel server, arriba, son las que valen).
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;

        client_max_body_size 1m;
        proxy_read_timeout 60s;
    }

    # ---- Lector de CV (spec 009): igual que /api/, pero con cuerpos de hasta 3 MB ----
    # El PDF puede pesar 2 MB (Spring lo limita a 2 MB); 3 MB deja margen al multipart.
    # Solo esta ruta: el resto de la API sigue estricta. Se repiten las directivas porque un
    # location no hereda las de otro.
    location /api/v1/cv/ {
        # El registro de errores de nginx copia la URL completa cuando falla el proxy
        # (con ?q=... incluido). Para que el texto que alguien busca no quede guardado,
        # aquí solo se registran errores críticos. Costo: se pierde el detalle de fallos
        # del proxy; el estado del backend se ve en su healthcheck.
        error_log /dev/stderr crit;
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend_upstream http://backend:8080;

        # proxy_pass sin parte de URI: la URI original (con /api/) llega tal cual al backend.
        proxy_pass $backend_upstream;

        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        # Se reemplaza (no se acumula) la cabecera que pueda traer el cliente: evita falsificarla.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Spring ya envía estas cabeceras; se ocultan para que no lleguen duplicadas
        # (las de nivel server, arriba, son las que valen).
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;

        client_max_body_size 3m;
        proxy_read_timeout 60s;
    }

    # ---- DORA (spec 012): turnos con audio de hasta 3 MB y respuestas en streaming (SSE) ----
    # Cuerpo de hasta 4 MB (el audio pesa como mucho 3 MB; Spring lo limita) y SIN búfer: cada evento del flujo
    # (transcripción, frase de DORA, audio, siguiente pregunta) llega al navegador apenas el backend lo escribe.
    # Solo esta ruta: el resto de la API sigue estricta. Se repiten las directivas porque un location no hereda las
    # de otro.
    location /api/v1/dora/ {
        # El registro de errores de nginx copia la URL completa cuando falla el proxy. Aquí solo se registran
        # errores críticos, como en /api/.
        error_log /dev/stderr crit;
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend_upstream http://backend:8080;

        # proxy_pass sin parte de URI: la URI original (con /api/) llega tal cual al backend.
        proxy_pass $backend_upstream;

        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        # Se reemplaza (no se acumula) la cabecera que pueda traer el cliente: evita falsificarla.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Conexión persistente con el backend durante el flujo.
        proxy_set_header Connection "";

        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;

        client_max_body_size 4m;
        # SSE: sin búfer ni caché en el proxy, para que la voz de DORA no espere.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
    }

    # ---- Los archivos con hash en el nombre no cambian: se guardan en caché mucho tiempo ----
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    location /brand/ {
        expires 1d;
        try_files $uri =404;
    }

    # ---- SPA: cualquier otra ruta devuelve index.html (el router decide en el navegador) ----
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
